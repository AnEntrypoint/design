name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build SDK bundle
        run: npm run build:ci

      - name: Check exports
        run: npm run lint:exports

      - name: Check ui kits
        run: npm run lint:ui-kits

      - name: Check component docs
        run: npm run lint:component-docs

      - name: Check component types
        run: npm run lint:component-types

      - name: Check component manifest
        run: npm run lint:component-manifest

      - name: Build home page
        run: npx --yes flatspace@latest build

      - name: Assemble whole static tree with home page at root
        run: |
          mkdir _site
          rsync -a \
            --exclude='/.git' --exclude='/.github' --exclude='/.gm' --exclude='/.agentplug' \
            --exclude='/.agentplug-kv' --exclude='/.wfgy' --exclude='/node_modules' \
            --exclude='/_site' --exclude='/scripts' --exclude='/visual-baselines' \
            --exclude='/rs-learn.db' --exclude='*.stackdump' \
            --exclude='/*.md' --exclude='/package.json' --exclude='/package-lock.json' \
            --exclude='/.editorconfig' --exclude='/.gitignore' --exclude='/flatspace.config.mjs' \
            --exclude='/types' --exclude='/vendor/axe-core' \
            --exclude='/dist/index.html' --exclude='/dist/.nojekyll' \
            ./ _site/
          cp dist/index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

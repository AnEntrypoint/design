<!-- Critical pre-stylesheet background: body's real background/color rule
     lives in src/css/app-shell/base.css, one of ~30 sheets app-shell.css's
     own @import barrel must fetch before it applies. On a cold cache that
     barrel resolution can outlast the module script's first render, leaving
     the UA default (often a stark white-on-transparent, or black under a
     dark OS theme) visible until every sheet lands -- reported as "blank
     page on first load, fine on reload" (reload = warm cache = barrel
     resolves instantly). colors_and_type.css is a render-blocking <link>
     above this block, so --bg/--fg (which follow data-theme="auto" and the
     OS scheme) are already defined here; only app-shell.css is the slow one. -->
<style>
html,body{background:var(--bg);color:var(--fg)}
/* Boot spinner: shown while #root:empty (app.js has not mounted yet); it
   stops matching, and disappears, the moment content is appended. The ring
   tint is derived from currentColor so it reads on both light and dark. */
#root:empty{min-height:100vh;display:flex;align-items:center;justify-content:center}
#root:empty::after{content:"";width:28px;height:28px;border-radius:50%;
  border:3px solid color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor;
  animation:ds-boot-spin .8s linear infinite}
@media (prefers-reduced-motion: reduce){#root:empty::after{animation:none;opacity:.6}}
@keyframes ds-boot-spin{to{transform:rotate(360deg)}}
</style>
<script type="importmap">
{ "imports": {
  "webjsx": "../../vendor/webjsx/index.js",
  "webjsx/": "../../vendor/webjsx/",
  "webjsx/jsx-runtime": "../../vendor/webjsx/jsx-runtime.js",
  "ds/": "../../src/"
} }
</script>
</head>
<body data-screen-label="17 Slide Deck">
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body></html>
